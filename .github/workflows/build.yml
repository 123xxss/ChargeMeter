name: build
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -sSLo "$RUNNER_TEMP/bt.zip" https://dl.google.com/android/repository/build-tools_r34-linux.zip
          curl -sSLo "$RUNNER_TEMP/p.zip" https://dl.google.com/android/repository/platform-36_r02.zip
          unzip -q "$RUNNER_TEMP/bt.zip" -d "$RUNNER_TEMP/sdk"
          unzip -q "$RUNNER_TEMP/p.zip" -d "$RUNNER_TEMP/sdk"
      - env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/sdk
          BUILD_TOOLS_DIR: ${{ runner.temp }}/sdk/android-14
          ANDROID_JAR: ${{ runner.temp }}/sdk/android-36/android.jar
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with: { name: ChargeMeter-apk, path: chargemeter.apk }
